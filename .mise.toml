[tools]
hk = "2.6.0"
python = "3.11"
"pipx:esptool" = "5.6.0"
"pipx:esp-idf-monitor" = "1.10.0"

[tasks.check]
description = "Check all files via hk"
run = "hk check --all"

[tasks."check:plan"]
description = "Preview hk check execution plan for modified files"
run = "hk check --plan"

[tasks."check:changed"]
description = "Check modified files via native hk check"
run = "hk check"

[tasks.fix]
description = "Auto-fix issues in modified files via hk"
run = "hk fix"

[tasks."fix:all"]
description = "Auto-fix issues in all files via hk"
run = "hk fix --all"

[tasks."hw:build"]
description = "Notice: Local hw:build is disabled by repository convention (delegated to CI)"
run = "echo 'Error: Local firmware compilation is disabled by repository policy. Push your branch and verify via: gh pr checks' && exit 1"

[tasks."hw:download"]
description = "Download the latest CI-built firmware artifact into dist/firmware"
run = "gh run download -n nano-esp-bot-firmware -D ${FIRMWARE_DIR:-dist/firmware}"

[tasks."hw:flash"]
description = "Flash the downloaded firmware to a connected ESP32-S3"
run = """
esptool.py --chip esp32s3 \
  -p ${ESPPORT:-/dev/ttyACM0} -b ${ESPBAUD:-460800} \
  --flash_mode dio --flash_size 16MB --flash_freq 80m \
  write_flash \
  0x0 ${FIRMWARE_DIR:-dist/firmware}/hardware/build/bootloader/bootloader.bin \
  0x8000 ${FIRMWARE_DIR:-dist/firmware}/hardware/build/partition_table/partition-table.bin \
  0x10000 ${FIRMWARE_DIR:-dist/firmware}/hardware/build/nano-esp-bot-hw.bin
"""

[tasks."hw:monitor"]
description = "Monitor ESP32-S3 serial output"
run = "idf-monitor -p ${ESPPORT:-/dev/ttyACM0} -b ${ESPBAUD:-115200}"
