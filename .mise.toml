[tools]
hk = "2.6.0"
python = "3.11"
"pipx:esptool" = "5.6.0"
"pipx:esp-idf-monitor" = "1.10.0"

[tasks.check]
description = "Check all files via hk"
run = "hk check --all"

[tasks."check:plan"]
description = "Preview hk check execution plan for modified files"
run = "hk check --plan"

[tasks."check:changed"]
description = "Check modified files via native hk check"
run = "hk check"

[tasks.fix]
description = "Auto-fix issues in modified files via hk"
run = "hk fix"

[tasks."fix:all"]
description = "Auto-fix issues in all files via hk"
run = "hk fix --all"

[tasks."hw:build"]
description = "Notice: Local hw:build is disabled by repository convention (delegated to CI)"
run = "echo 'Error: Local firmware compilation is disabled by repository policy. Push your branch and verify via: gh pr checks' && exit 1"

[tasks."hw:download"]
description = "Download latest built firmware artifacts from GitHub Actions CI"
run = "bash scripts/download-firmware.sh"

[tasks."hw:flash"]
description = "Flash downloaded firmware to connected ESP32-S3 via esptool"
run = "bash scripts/flash-firmware.sh"

[tasks."hw:monitor"]
description = "Monitor ESP32-S3 serial output"
run = "bash scripts/monitor-device.sh"
