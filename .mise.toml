[tools]
hk = "2.6.0"
python = "3.11"
"pipx:esptool" = "5.6.0"
"pipx:esp-idf-monitor" = "1.10.0"

[tasks.check]
description = "Check all files via hk"
run = "hk check --all"

[tasks."check:plan"]
description = "Preview hk check execution plan for modified files"
run = "hk check --plan"

[tasks."check:changed"]
description = "Check modified files via native hk check"
run = "hk check"

[tasks.fix]
description = "Auto-fix issues in modified files via hk"
run = "hk fix"

[tasks."fix:all"]
description = "Auto-fix issues in all files via hk"
run = "hk fix --all"

[tasks."hw:download"]
description = "Download the latest CI-built firmware artifact into dist/firmware"
run = "gh run download -n nano-esp-bot-firmware -D ${FIRMWARE_DIR:-dist/firmware}"

[tasks."hw:flash"]
description = "Flash the downloaded firmware to a connected ESP32-S3"
run = """
esptool --chip esp32s3 \
  --port ${ESPPORT:-/dev/ttyACM0} --baud ${ESPBAUD:-460800} \
  write-flash --flash-mode dio --flash-size 16MB --flash-freq 80m \
  0x0 ${FIRMWARE_DIR:-dist/firmware}/bootloader/bootloader.bin \
  0x8000 ${FIRMWARE_DIR:-dist/firmware}/partition_table/partition-table.bin \
  0x10000 ${FIRMWARE_DIR:-dist/firmware}/nano-esp-bot-hw.bin
"""

[tasks."hw:monitor"]
description = "Monitor ESP32-S3 serial output"
run = "idf-monitor -p ${ESPPORT:-/dev/ttyACM0} -b ${ESPBAUD:-115200}"
